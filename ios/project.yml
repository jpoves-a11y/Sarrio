# Proyecto Xcode generado con XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen && cd ios && xcodegen
# El .xcodeproj no se versiona: este archivo es la fuente de verdad.
name: Sarrio
options:
  bundleIdPrefix: com.sarrio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SARRIO_TEAM_ID)
packages:
  SarrioKit:
    path: Packages/SarrioKit
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    from: "11.25.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  Sarrio:
    type: application
    platform: iOS
    sources:
      - path: Sarrio
      - path: Shared
    dependencies:
      - package: SarrioKit
      - package: MapboxMaps
      - target: SarrioShare
        embed: true
    entitlements:
      path: Sarrio/Sarrio.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin: [Default]
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups: [group.$(SARRIO_BUNDLE_ID)]
        aps-environment: $(SARRIO_APS_ENVIRONMENT)
    info:
      path: Sarrio/Info.plist
      properties:
        CFBundleDisplayName: Sarrio
        UILaunchScreen:
          UIImageName: LaunchMark
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        SarrioAPIBaseURL: $(SARRIO_API_BASE_URL)
        SarrioAppGroup: group.$(SARRIO_BUNDLE_ID)
        NSHealthShareUsageDescription: >-
          Sarrio lee tus entrenamientos y sus rutas GPS para detectar las cumbres que has subido.
        # Apple la exige con el permiso de HealthKit aunque Sarrio solo lee (nunca escribe en Salud)
        NSHealthUpdateUsageDescription: >-
          Sarrio no escribe en Salud: solo lee tus entrenamientos para detectar las cumbres que has subido.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPS track
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx, com.garmin.fit, com.garmin.tcx]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX track
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
          - UTTypeIdentifier: com.garmin.fit
            UTTypeDescription: FIT activity
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fit]
          - UTTypeIdentifier: com.garmin.tcx
            UTTypeDescription: TCX activity
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [tcx]
              public.mime-type: [application/vnd.garmin.tcx+xml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SARRIO_BUNDLE_ID)
        # Vacío en local (firma automática); el workflow de TestFlight pone su perfil de App Store
        PROVISIONING_PROFILE_SPECIFIER: $(SARRIO_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  SarrioShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SarrioShare
      - path: Shared
    entitlements:
      path: SarrioShare/SarrioShare.entitlements
      properties:
        com.apple.security.application-groups: [group.$(SARRIO_BUNDLE_ID)]
    info:
      path: SarrioShare/Info.plist
      properties:
        CFBundleDisplayName: Sarrio
        SarrioAppGroup: group.$(SARRIO_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Solo aparece con GPX, FIT o TCX (o XML/datos genéricos con esa extensión).
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $att,
              ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "com.topografix.gpx"
              || ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "com.garmin.fit"
              || ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "com.garmin.tcx"
              ).@count > 0).@count > 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SARRIO_BUNDLE_ID).share
        PROVISIONING_PROFILE_SPECIFIER: $(SARRIO_SHARE_PROFILE)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  SarrioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SarrioTests]
    dependencies:
      - target: Sarrio
schemes:
  Sarrio:
    build:
      targets:
        Sarrio: all
    test:
      targets: [SarrioTests]
