name: Publicar en redes

# Publica las piezas de marketing/queue que ya están en main (aprobadas con el merge del PR)
# cuando llega su fecha, y apunta cada publicación en marketing/published/log.json.
# Las redes sin secretos se saltan sin error. Ver marketing/README.md.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo simular"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar
        run: node tools/social/publish.mjs publish ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Guardar el registro
        if: always()
        run: |
          if git diff --quiet marketing/published/log.json; then exit 0; fi
          git config user.name "sarrio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/published/log.json
          git commit -m "Redes: registro de publicaciones"
          git pull --rebase origin main
          git push origin HEAD:main
