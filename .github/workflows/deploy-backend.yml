name: Desplegar backend

# Despliega la API en Cloudflare Workers, aplica las migraciones en Turso
# y, opcionalmente, importa picos de OpenStreetMap.
# Se lanza a mano: Actions → Desplegar backend → Run workflow.
on:
  workflow_dispatch:
    inputs:
      import_peaks:
        description: "Regiones de picos a importar (separadas por espacios; vacío = ninguna)"
        required: false
        default: "pirineos sierra-nevada picos-de-europa sistema-central"

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Comprobar secretos
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN JWT_SECRET TOKEN_ENCRYPTION_KEY BUNDLE_ID; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v"; missing=1; fi
          done
          exit $missing

      - run: npm ci
      - run: npm test

      - name: Migraciones de la base de datos
        run: npx drizzle-kit migrate

      - name: Bucket R2
        run: npx wrangler r2 bucket create sarrio-files || echo "El bucket ya existe"

      - name: Desplegar Worker
        run: npx wrangler deploy --var APPLE_BUNDLE_ID:"$BUNDLE_ID" 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Secretos del Worker
        run: |
          for v in TURSO_DATABASE_URL TURSO_AUTH_TOKEN JWT_SECRET TOKEN_ENCRYPTION_KEY; do
            printf '%s' "${!v}" | npx wrangler secret put "$v"
          done

      - name: Importar picos
        if: ${{ inputs.import_peaks != '' }}
        run: |
          for region in ${{ inputs.import_peaks }}; do
            node ../tools/peaks/fetch-peaks.mjs "$region" > "peaks-$region.sql"
            node --input-type=module -e "
              import { createClient } from '@libsql/client';
              import fs from 'node:fs';
              const c = createClient({ url: process.env.TURSO_DATABASE_URL, authToken: process.env.TURSO_AUTH_TOKEN });
              await c.executeMultiple(fs.readFileSync('peaks-$region.sql', 'utf8'));
              console.log('Importada $region');
            "
            sleep 5
          done

      - name: Comprobar API
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          echo "API: $URL"
          sleep 5
          curl -fsS "$URL/health"
          echo "### API desplegada en $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Copia esa URL al secreto SARRIO_API_BASE_URL antes de lanzar TestFlight." >> "$GITHUB_STEP_SUMMARY"
